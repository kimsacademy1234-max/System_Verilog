<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#fff}

  .sub{font-size:15px;fill:#6b7280}
  .boxT{fill:#f8fafc;stroke:#334155;stroke-width:2.5}
  .boxD{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}
  .boxF{fill:#fff;stroke:#6366f1;stroke-width:1.6}
  .boxS{fill:#fff7ed;stroke:#c2410c;stroke-width:1.8}
  .boxG{fill:#fff;stroke:#334155;stroke-width:1.6}
  .lblT{font-size:19px;font-weight:700;fill:#0f172a}
  .lblD{font-size:16px;font-weight:700;fill:#3730a3}
  .lblF{font-size:13px;fill:#1e1b4b;text-anchor:middle}
  .lblFb{font-size:14px;font-weight:700;fill:#1e1b4b;text-anchor:middle}
  .io{font-size:15px;font-weight:700}

  .wIn{stroke:#2563eb;stroke-width:2;fill:none}
  .wBus{stroke:#2563eb;stroke-width:4;fill:none}

  .mono{font-family:Consolas,'D2Coding',monospace;font-size:14px;fill:#334155}
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<defs>
  <marker id="aB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="aG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/></marker>
  <marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ea580c"/></marker>
  <marker id="aN" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
</defs>

<text x="40" y="42" class="title">8-bit Ripple Carry Adder — 블록 다이어그램</text>
<text x="40" y="66" class="sub">상위 모듈(Full_Adder_8bit) → Full_Adder_4bit → Full_Adder → Half_Adder 순으로 내려가는 계층 구조 · Basys3 I/O 매핑 포함</text>

<!-- ============ A. Top module ============ -->
<rect x="180" y="90" width="1130" height="470" rx="14" class="boxT"/>
<text x="198" y="116" class="lblT">Full_Adder_8bit  (Top)</text>

<!-- input labels -->
<text x="20" y="140" class="io tIn">i_a[7:0]</text><text x="20" y="156" class="ioS">SW0 – SW7</text>
<text x="20" y="183" class="io tIn">i_b[7:0]</text><text x="20" y="199" class="ioS">SW8 – SW15</text>
<text x="20" y="372" class="io tIn">i_cin</text><text x="20" y="388" class="ioS">BTNL (W19)</text>
<!-- input buses -->
<path d="M100,135 H1060" class="wBus"/>
<path d="M100,178 H1100" class="wBus"/>
<path d="M420,135 V198" class="wIn" marker-end="url(#aB)"/><text x="378" y="162" class="small">[3:0]</text>
<path d="M460,178 V198" class="wIn" marker-end="url(#aB)"/><text x="466" y="194" class="small">[3:0]</text>
<path d="M900,135 V198" class="wIn" marker-end="url(#aB)"/><text x="858" y="162" class="small">[7:4]</text>
<path d="M940,178 V198" class="wIn" marker-end="url(#aB)"/><text x="946" y="194" class="small">[7:4]</text>
<circle cx="420" cy="135" r="4" fill="#2563eb"/><circle cx="460" cy="178" r="4" fill="#2563eb"/>
<circle cx="900" cy="135" r="4" fill="#2563eb"/><circle cx="940" cy="178" r="4" fill="#2563eb"/>

<!-- DUT_1 -->
<rect x="215" y="200" width="450" height="285" rx="10" class="boxD"/>
<text x="230" y="224" class="lblD">DUT_1 : Full_Adder_4bit   (bit 3:0)</text>
<!-- DUT_2 -->
<rect x="695" y="200" width="450" height="285" rx="10" class="boxD"/>
<text x="710" y="224" class="lblD">DUT_2 : Full_Adder_4bit   (bit 7:4)</text>

<!-- Full adders: DUT_1 x=235,345,455,565 ; DUT_2 x=715,825,935,1045 ; w=86 y=270 h=96 -->
<g>
  <rect x="235" y="270" width="86" height="96" rx="7" class="boxF"/><text x="278" y="300" class="lblFb">U_HA1</text><text x="278" y="318" class="lblF">Full_Adder</text><text x="278" y="352" class="lblF">bit 0</text>
  <rect x="345" y="270" width="86" height="96" rx="7" class="boxF"/><text x="388" y="300" class="lblFb">U_HA2</text><text x="388" y="318" class="lblF">Full_Adder</text><text x="388" y="352" class="lblF">bit 1</text>
  <rect x="455" y="270" width="86" height="96" rx="7" class="boxF"/><text x="498" y="300" class="lblFb">U_HA3</text><text x="498" y="318" class="lblF">Full_Adder</text><text x="498" y="352" class="lblF">bit 2</text>
  <rect x="565" y="270" width="86" height="96" rx="7" class="boxF"/><text x="608" y="300" class="lblFb">U_HA4</text><text x="608" y="318" class="lblF">Full_Adder</text><text x="608" y="352" class="lblF">bit 3</text>
  <rect x="715" y="270" width="86" height="96" rx="7" class="boxF"/><text x="758" y="300" class="lblFb">U_HA1</text><text x="758" y="318" class="lblF">Full_Adder</text><text x="758" y="352" class="lblF">bit 4</text>
  <rect x="825" y="270" width="86" height="96" rx="7" class="boxF"/><text x="868" y="300" class="lblFb">U_HA2</text><text x="868" y="318" class="lblF">Full_Adder</text><text x="868" y="352" class="lblF">bit 5</text>
  <rect x="935" y="270" width="86" height="96" rx="7" class="boxF"/><text x="978" y="300" class="lblFb">U_HA3</text><text x="978" y="318" class="lblF">Full_Adder</text><text x="978" y="352" class="lblF">bit 6</text>
  <rect x="1045" y="270" width="86" height="96" rx="7" class="boxF"/><text x="1088" y="300" class="lblFb">U_HA4</text><text x="1088" y="318" class="lblF">Full_Adder</text><text x="1088" y="352" class="lblF">bit 7</text>
</g>
<!-- per-bit a/b into FA tops -->
<g class="small" text-anchor="middle">
  <text x="278" y="250">a0 b0</text><text x="388" y="250">a1 b1</text><text x="498" y="250">a2 b2</text><text x="608" y="250">a3 b3</text>
  <text x="758" y="250">a4 b4</text><text x="868" y="250">a5 b5</text><text x="978" y="250">a6 b6</text><text x="1088" y="250">a7 b7</text>
</g>
<g>
  <path d="M278,255 V268" class="wIn" marker-end="url(#aB)"/><path d="M388,255 V268" class="wIn" marker-end="url(#aB)"/>
  <path d="M498,255 V268" class="wIn" marker-end="url(#aB)"/><path d="M608,255 V268" class="wIn" marker-end="url(#aB)"/>
  <path d="M758,255 V268" class="wIn" marker-end="url(#aB)"/><path d="M868,255 V268" class="wIn" marker-end="url(#aB)"/>
  <path d="M978,255 V268" class="wIn" marker-end="url(#aB)"/><path d="M1088,255 V268" class="wIn" marker-end="url(#aB)"/>
</g>

<!-- carry chain (orange) -->
<path d="M100,367 H200 V335 H233" class="wC" marker-end="url(#aO)"/>
<path d="M321,335 H343" class="wC" marker-end="url(#aO)"/><text x="332" y="356" class="tC" text-anchor="middle">c1</text>
<path d="M431,335 H453" class="wC" marker-end="url(#aO)"/><text x="442" y="356" class="tC" text-anchor="middle">c2</text>
<path d="M541,335 H563" class="wC" marker-end="url(#aO)"/><text x="552" y="356" class="tC" text-anchor="middle">c3</text>
<path d="M651,335 H713" class="wC" marker-end="url(#aO)"/><text x="682" y="356" class="tC" text-anchor="middle">w_c</text>
<path d="M801,335 H823" class="wC" marker-end="url(#aO)"/><text x="812" y="356" class="tC" text-anchor="middle">c1</text>
<path d="M911,335 H933" class="wC" marker-end="url(#aO)"/><text x="922" y="356" class="tC" text-anchor="middle">c2</text>
<path d="M1021,335 H1043" class="wC" marker-end="url(#aO)"/><text x="1032" y="356" class="tC" text-anchor="middle">c3</text>
<path d="M1131,335 H1163" class="wC" marker-end="url(#aO)"/><text x="1147" y="356" class="tC" text-anchor="middle">w_fc</text>

<!-- sum outputs -->
<g>
  <path d="M278,366 V398" class="wOut"/><path d="M388,366 V398" class="wOut"/><path d="M498,366 V398" class="wOut"/><path d="M608,366 V398" class="wOut"/>
  <path d="M278,398 H608" class="wOutB"/><path d="M440,398 V500" class="wOutB"/>
  <path d="M758,366 V398" class="wOut"/><path d="M868,366 V398" class="wOut"/><path d="M978,366 V398" class="wOut"/><path d="M1088,366 V398" class="wOut"/>
  <path d="M758,398 H1088" class="wOutB"/><path d="M920,398 V500" class="wOutB"/>
  <path d="M440,500 H1318" class="wOutB" marker-end="url(#aG)"/>
</g>
<g class="small tOut">
  <text x="282" y="388">s0</text><text x="392" y="388">s1</text><text x="502" y="388">s2</text><text x="612" y="388">s3</text>
  <text x="762" y="388">s4</text><text x="872" y="388">s5</text><text x="982" y="388">s6</text><text x="1092" y="388">s7</text>
</g>
<text x="446" y="440" class="small tOut">o_s[3:0]</text><text x="926" y="440" class="small tOut">o_s[7:4]</text>

<!-- 7-seg logic -->
<rect x="1165" y="300" width="125" height="110" rx="9" class="boxS"/>
<text x="1227" y="324" class="lblFb" style="fill:#9a3412">7-Seg 표시</text>
<text x="1227" y="346" class="lblF">w_fc ? 'C' : OFF</text>
<text x="1227" y="366" class="lblF">seg = 1000110</text>
<text x="1227" y="386" class="lblF">an = 1110</text>
<!-- o_c_out branch -->
<path d="M1150,335 V250 H1318" class="wC" marker-end="url(#aO)"/><circle cx="1150" cy="335" r="4" fill="#ea580c"/>
<path d="M1290,345 H1318" class="wOut" marker-end="url(#aG)"/>
<path d="M1290,385 H1318" class="wOut" marker-end="url(#aG)"/>

<!-- output labels -->
<text x="1328" y="246" class="io" style="fill:#c2410c">o_c_out</text><text x="1328" y="263" class="ioS">LD4 (W18) · 최종 자리올림</text>
<text x="1328" y="341" class="io tOut">seg[6:0]</text><text x="1328" y="358" class="ioS">7-Segment 'C' 표시</text>
<text x="1328" y="390" class="io tOut">an[3:0]</text><text x="1328" y="407" class="ioS">AN0 만 켜기 (1110)</text>
<text x="1328" y="496" class="io tOut">o_s[7:0]</text><text x="1328" y="513" class="ioS">LD0–LD3 · LD5–LD8</text>

<!-- legend -->
<g transform="translate(200,585)">
  <path d="M0,0 H40" class="wBus"/><text x="50" y="5" class="small">입력 (스위치/버튼)</text>
  <path d="M200,0 H240" class="wOutB"/><text x="250" y="5" class="small">출력 (LED/7-Seg)</text>
  <path d="M400,0 H440" class="wC" style="stroke-width:3"/><text x="450" y="5" class="small">Carry 전파 경로 = 가장 긴 조합 경로 (Critical path)</text>
</g>

<!-- ============ B. detail panels ============ -->
<!-- Panel 1: hierarchy -->
<rect x="30" y="625" width="500" height="430" rx="12" class="panel"/>
<text x="50" y="655" class="ptitle">① 모듈 계층 구조</text>
<path d="M85,712 V932 M85,747 H110 M85,887 H110 M85,932 H110" class="wN"/>
<path d="M135,762 V792 H160" class="wN"/>
<path d="M185,807 V837 H210" class="wN"/>
<rect x="55" y="678" width="250" height="34" rx="7" class="boxT" style="stroke-width:2"/><text x="70" y="701" class="lblFb" style="text-anchor:start">Full_Adder_8bit  (Top)</text>
<rect x="110" y="732" width="250" height="30" rx="7" class="boxD"/><text x="122" y="752" class="lblF" style="text-anchor:start;font-weight:700">DUT_1 : Full_Adder_4bit</text>
<rect x="160" y="777" width="250" height="30" rx="7" class="boxF"/><text x="172" y="797" class="lblF" style="text-anchor:start">U_HA1 ~ U_HA4 : Full_Adder × 4</text>
<rect x="210" y="822" width="290" height="30" rx="7" class="boxG"/><text x="222" y="842" class="lblF" style="text-anchor:start">U_HA1, U_HA2 : Half_Adder × 2  +  OR</text>
<rect x="110" y="872" width="250" height="30" rx="7" class="boxD"/><text x="122" y="892" class="lblF" style="text-anchor:start;font-weight:700">DUT_2 : Full_Adder_4bit</text>
<text x="370" y="892" class="small">(DUT_1과 같은 구조)</text>
<rect x="110" y="917" width="250" height="30" rx="7" class="boxS"/><text x="122" y="937" class="lblF" style="text-anchor:start;font-weight:700;fill:#9a3412">7-Seg 표시 로직 (assign)</text>
<text x="55" y="990" class="small" style="font-weight:700">인스턴스 수</text>
<text x="55" y="1013" class="small">Full_Adder_4bit × 2  ·  Full_Adder × 8  ·  Half_Adder × 16</text>
<text x="55" y="1036" class="small">Carry가 지나가는 Full_Adder 단수 = 8단 (ripple)</text>

<!-- Panel 2: Full_Adder -->
<rect x="550" y="625" width="540" height="430" rx="12" class="panel"/>
<text x="570" y="655" class="ptitle">② Full_Adder = Half_Adder × 2 + OR</text>
<text x="575" y="735" class="io tIn">i_a</text><text x="575" y="775" class="io tIn">i_b</text><text x="575" y="865" class="io tIn">i_cin</text>
<path d="M612,730 H648" class="wIn" marker-end="url(#aB)"/>
<path d="M612,770 H648" class="wIn" marker-end="url(#aB)"/>
<path d="M622,860 H818" class="wC" marker-end="url(#aO)"/>
<rect x="650" y="705" width="115" height="90" rx="8" class="boxF"/><text x="707" y="742" class="lblFb">U_HA1</text><text x="707" y="762" class="lblF">Half_Adder</text>
<text x="770" y="724" class="tC">c</text><text x="770" y="790" class="small">s</text>
<path d="M765,730 H958" class="wC" marker-end="url(#aO)"/><text x="850" y="722" class="tC">w_c1</text>
<path d="M765,770 H790 V820 H818" class="wN" marker-end="url(#aN)"/><text x="796" y="800" class="small">w_s1</text>
<rect x="820" y="795" width="115" height="90" rx="8" class="boxF"/><text x="877" y="832" class="lblFb">U_HA2</text><text x="877" y="852" class="lblF">Half_Adder</text>
<path d="M935,820 H945 V770 H958" class="wC" marker-end="url(#aO)"/><text x="940" y="813" class="tC">w_c2</text>
<path d="M935,860 H1040" class="wOut" marker-end="url(#aG)"/><text x="1046" y="865" class="io tOut">o_s</text>
<rect x="960" y="712" width="70" height="76" rx="8" class="boxG"/><text x="995" y="747" class="lblFb">OR</text><text x="995" y="766" class="lblF">≥1</text>
<path d="M1030,750 H1040" class="wC" marker-end="url(#aO)"/><text x="1046" y="755" class="io" style="fill:#c2410c">o_c</text>
<text x="575" y="935" class="mono">o_s = a ⊕ b ⊕ cin</text>
<text x="575" y="960" class="mono">o_c = (a·b) + ((a ⊕ b)·cin)</text>
<text x="575" y="1000" class="small">→ 첫 번째 HA가 a+b, 두 번째 HA가 그 합 + cin 을 계산하고</text>
<text x="575" y="1022" class="small">   두 캐리 중 하나라도 1이면 OR로 자리올림(o_c) 발생</text>

<!-- Panel 3: Half_Adder -->
<rect x="1110" y="625" width="460" height="430" rx="12" class="panel"/>
<text x="1130" y="655" class="ptitle">③ Half_Adder = XOR + AND</text>
<text x="1135" y="733" class="io tIn">i_a</text><text x="1135" y="757" class="io tIn">i_b</text>
<path d="M1170,728 H1258" class="wIn" marker-end="url(#aB)"/>
<path d="M1170,752 H1258" class="wIn" marker-end="url(#aB)"/>
<path d="M1200,728 V838 H1258" class="wIn" marker-end="url(#aB)"/><circle cx="1200" cy="728" r="4" fill="#2563eb"/>
<path d="M1225,752 V862 H1258" class="wIn" marker-end="url(#aB)"/><circle cx="1225" cy="752" r="4" fill="#2563eb"/>
<rect x="1260" y="710" width="120" height="60" rx="8" class="boxG"/><text x="1320" y="737" class="lblFb">XOR</text><text x="1320" y="757" class="lblF">a ⊕ b</text>
<rect x="1260" y="820" width="120" height="60" rx="8" class="boxG"/><text x="1320" y="847" class="lblFb">AND</text><text x="1320" y="867" class="lblF">a · b</text>
<path d="M1380,740 H1458" class="wOut" marker-end="url(#aG)"/><text x="1466" y="745" class="io tOut">o_s</text>
<path d="M1380,850 H1458" class="wC" marker-end="url(#aO)"/><text x="1466" y="855" class="io" style="fill:#c2410c">o_c</text>
<g class="mono">
  <text x="1170" y="930">a b │ o_c o_s</text>
  <text x="1170" y="948">────┼────────</text>
  <text x="1170" y="968">0 0 │  0   0</text>
  <text x="1170" y="988">0 1 │  0   1</text>
  <text x="1170" y="1008">1 0 │  0   1</text>
  <text x="1170" y="1028">1 1 │  1   0</text>
</g>
<text x="1380" y="968" class="small">게이트 2개로 된</text>
<text x="1380" y="988" class="small">가장 작은 단위 모듈</text>
</svg>
</body></html>
